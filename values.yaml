# Every feature below is OFF until you set its `enabled: true`. Entries of a feature go
# under its `items`, keyed by resource name (maps, not lists, so an environment file can
# change, disable or remove a single entry). Each item can also set `enabled: false`.

# -- Master switch. When false the subchart renders nothing.
enabled: true

# -- API version of the External Secrets Operator CRDs.
# Use "external-secrets.io/v1" for ESO >= 0.17, "external-secrets.io/v1beta1" for older operators.
apiVersion: external-secrets.io/v1
# -- API version used for PushSecret (still alpha in ESO).
pushSecretApiVersion: external-secrets.io/v1alpha1

# -- Optional prefix added to every generated resource name (e.g. "{{ .Release.Name }}-").
# Rendered with tpl, so templates are allowed.
namePrefix: ""

# -- Labels added to every resource.
commonLabels: {}
# -- Annotations added to every resource.
commonAnnotations: {}

# -- Defaults applied to every ExternalSecret / PushSecret unless overridden per item.
defaults:
  refreshInterval: 1h
  # Store for externalSecrets/pushSecrets items that set neither `source` nor `secretStoreRef`.
  # When empty, the Secrets Manager store (or Parameter Store if only that is enabled) is used.
  secretStoreRef:
    name: ""          # e.g. "vault-backend"; may be templated
    kind: SecretStore # or ClusterSecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain

# -- The app's IAM role (IRSA), used by parameterStore and secretsManager below. Renders a
# ServiceAccount carrying `roleArn`; only ESO uses it (token automount is off), so the app's
# own pods can't assume the role. Required when either block is enabled.
aws:
  roleArn: ""                  # arn:aws:iam::<account>:role/<app>-secrets; may be templated
  region: ""                   # e.g. eu-west-1
  # How ESO gets the role (see README "Authentication"):
  #   irsa         per-app ServiceAccount <release>-secrets with the role (IRSA); ESO >= 0.17
  #   podIdentity  no per-app ServiceAccount; ESO's own EKS Pod Identity credentials assume
  #                roleArn with session tags the role's trust policy checks; ESO >= 2.5.0
  auth: irsa
  # irsa only. Exact name, not prefixed with namePrefix. Must match the IAM role's trust policy.
  serviceAccountName: ""       # default "<release name>-secrets"
  serviceAccountAnnotations: {}

# -- SSM Parameter Store. Renders SecretStore "<release>-parameter-store". Each entry under
# `secrets` becomes one Kubernetes Secret: list SECRET_KEY: /parameter/name pairs, and/or
# `fromPath` to take every parameter under a path. Reserved entry keys: enabled,
# refreshInterval, type, template, fromPath.
parameterStore:
  enabled: false
  # refreshInterval: 1h        # for all entries; defaults.refreshInterval otherwise
  secrets: {}
#    my-app-config:              # -> Secret "my-app-config"
#      LOG_LEVEL: /my-app/log-level
#      API_URL: /my-app/api-url
#    my-app-flags:
#      fromPath: /my-app/flags/  # /my-app/flags/FEATURE_X -> key FEATURE_X (deeper "/" -> "_")
#      refreshInterval: 5m
#    my-app-db:
#      DB_HOST: /my-app/db/host
#      DB_PASS: /my-app/db/password
#      template:                 # extra keys from ESO templates; fetched keys are kept
#        DATABASE_URL: "postgres://app:{{ .DB_PASS }}@{{ .DB_HOST }}:5432/app"

# -- AWS Secrets Manager. Renders SecretStore "<release>-secrets-manager". Each entry under
# `secrets` becomes one Kubernetes Secret: list SECRET_KEY: secret-name pairs ({key, property}
# for a JSON field), and/or `fromSecret` to take every JSON field of one secret. Reserved
# entry keys: enabled, refreshInterval, type, template, fromSecret.
secretsManager:
  enabled: false
  # refreshInterval: 1h
  secrets: {}
#    my-app-env:
#      fromSecret: my-app/env    # every JSON field becomes a key
#    db-credentials:
#      DB_USER: {key: my-app/db, property: username}
#      DB_PASS: {key: my-app/db, property: password}
#      API_TOKEN: my-app/api-token   # plain-text secret
#    registry-creds:
#      type: kubernetes.io/dockerconfigjson   # Kubernetes Secret type
#      .dockerconfigjson: my-app/registry-auth

# ---------------------------------------------------------------------------------------
# Advanced: full ESO resources. Use these when the blocks above aren't enough
# (templates, generators, other providers, cluster-scoped resources).

