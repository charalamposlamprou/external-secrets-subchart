# Advanced: explicit IRSA ServiceAccounts referenced by generic stores.
namePrefix: "{{ .Release.Name }}-"
serviceAccounts:
  enabled: true
  items:
    app-secrets:
      roleArn: arn:aws:iam::123456789012:role/app-secrets
    shared-secrets:
      namespace: platform
      roleArn: "arn:aws:iam::123456789012:role/{{ .Release.Name }}-shared"
secretStores:
  enabled: true
  items:
    aws:
      provider:
        aws:
          service: SecretsManager
          region: eu-west-1
          auth:
            jwt:
              serviceAccountRef: {name: app-secrets}
clusterSecretStores:
  enabled: true
  items:
    aws-shared:
      provider:
        aws:
          service: SecretsManager
          region: eu-west-1
          auth:
            jwt:
              serviceAccountRef: {name: shared-secrets}
    controller-role:            # no auth: uses the ESO controller's own role
      provider:
        aws: {service: ParameterStore, region: eu-west-1}
defaults:
  secretStoreRef: {name: aws}
externalSecrets:
  enabled: true
  items:
    app-env:
      dataFrom:
        - extract: {key: app/env}
