---
# Source: external-secrets-subchart/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-params
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.1
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ci-params
automountServiceAccountToken: false
---
# Source: external-secrets-subchart/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: config
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.1
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: ci-parameter-store
    kind: SecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: config
  dataFrom:
    - find:
        name:
          regexp: .*
        path: /config
      rewrite:
      - regexp:
          source: ^/config/
          target: ""
      - regexp:
          source: /
          target: _
---
# Source: external-secrets-subchart/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fallback
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.1
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: ci-parameter-store
    kind: SecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: fallback
  dataFrom:
    - extract:
        key: /config/json-blob
---
# Source: external-secrets-subchart/templates/secretstore.yaml
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ci-parameter-store
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.1
spec:
  provider:
    aws:
      auth:
        jwt:
          serviceAccountRef:
            name: ci-params
      region: us-east-1
      service: ParameterStore
