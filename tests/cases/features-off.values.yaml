# Features are opt-in: entries of a block without `enabled: true` don't render, and the
# aws role isn't required while no AWS block is enabled.
defaults:
  secretStoreRef: {name: somewhere}
externalSecrets:
  items:
    not-rendered:
      dataFrom: [{extract: {key: k}}]
pushSecrets:
  enabled: false
  items:
    not-rendered:
      selector: {secret: {name: s}}
      data: [{match: {secretKey: k, remoteRef: {remoteKey: k}}}]
parameterStore:
  secrets:
    not-rendered: {X: /x}
secretsManager:
  enabled: false
  secrets:
    not-rendered: {fromSecret: x}
