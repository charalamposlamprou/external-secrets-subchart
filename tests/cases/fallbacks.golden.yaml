apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: defaulted
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.0
  annotations:
    owner: platform
spec:
  externalSecretName: defaulted
  namespaces:
    - team-a
  externalSecretSpec:
    dataFrom:
