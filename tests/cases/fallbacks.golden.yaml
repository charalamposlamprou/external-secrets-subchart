    helm.sh/chart: external-secrets-subchart-0.5.0
  annotations:
    owner: platform
spec:
  refreshInterval: "2h"
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: ci-shared
      kind: ClusterSecretStore
  selector:
    secret:
      name: s
  data:
    - match:
        remoteRef:
          remoteKey: app/k
        secretKey: k
