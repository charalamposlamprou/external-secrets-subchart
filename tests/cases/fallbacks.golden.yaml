      kind: ClusterSecretStore
      name: ci-shared
---
# Source: external-secrets-subchart/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: custom-target
  namespace: other
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
