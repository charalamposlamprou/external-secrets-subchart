apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ci-by-label
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
