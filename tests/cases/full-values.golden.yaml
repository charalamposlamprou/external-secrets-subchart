---
# Source: external-secrets-subchart/templates/clusterexternalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: ci-registry
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.0
    team: platform
spec:
  externalSecretName: ci-registry
  namespaceSelectors:
    - matchLabels:
        team: payments
  externalSecretSpec:
    dataFrom:
    - extract:
        key: shared/registry
    secretStoreRef:
      kind: ClusterSecretStore
      name: ci-aws-global
    target:
      name: registry-creds
      template:
        data:
          .dockerconfigjson: '{{ .config }}'
        type: kubernetes.io/dockerconfigjson
---
# Source: external-secrets-subchart/templates/secretstore.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ci-aws-global
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.0
    team: platform
spec:
  provider:
    aws:
      region: eu-west-1
      service: SecretsManager
---
# Source: external-secrets-subchart/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-aws-config
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.0
    team: app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: ci-aws-global
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ci-aws-config
  dataFrom:
    - extract:
        key: app/config
---
# Source: external-secrets-subchart/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-db-credentials
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.0
    team: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: ci-vault-backend
    kind: SecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ci-db-credentials
    template:
      data:
        DATABASE_URL: postgres://{{ .username }}:{{ .password }}@db:5432/app
      type: Opaque
  data:
    - remoteRef:
        key: app/db
        property: username
      secretKey: username
    - remoteRef:
        key: app/db
        property: password
      secretKey: password
---
# Source: external-secrets-subchart/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-fetch-once
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.0
    team: platform
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: ci-vault-backend
    kind: SecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ci-fetch-once
  dataFrom:
    - extract:
        key: app/static
---
# Source: external-secrets-subchart/templates/pushsecret.yaml
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ci-api-key
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.0
    team: platform
spec:
  refreshInterval: "1h"
  secretStoreRefs:
    - name: ci-vault-backend
      kind: SecretStore
  selector:
    secret:
      name: api-key
  data:
    - match:
        remoteRef:
          property: key
          remoteKey: app/api-key
        secretKey: key
---
