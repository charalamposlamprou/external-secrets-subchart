# The simple blocks: one IAM role, Parameter Store and Secrets Manager secrets grouped by service.
namePrefix: "{{ .Release.Name }}-"
aws:
  roleArn: arn:aws:iam::123456789012:role/ci-secrets
  region: eu-west-1
  serviceAccountAnnotations: {owner: platform}
parameterStore:
  enabled: true
  refreshInterval: 10m
  secrets:
    app-config:
      LOG_LEVEL: /ci/log-level
      API_URL: /ci/api-url
    app-flags:
      fromPath: /ci/flags/          # strip prefix, nested "/" -> "_"
      refreshInterval: 0            # per-entry override, kept as 0
    mixed:
      EXTRA: /ci/extra
      fromPath: ci/more             # no slashes given: normalised to /ci/more
    switched-off:
      enabled: false
      X: /ci/x
    removed: null
secretsManager:
  enabled: true
  secrets:
    app-env:
      fromSecret: ci/env
    db-credentials:
      DB_USER: {key: ci/db, property: username}
      DB_PASS: {key: ci/db, property: password, version: AWSCURRENT}
      API_TOKEN: ci/api-token
externalSecrets:                    # advanced items still mix in, choosing a store by source
  enabled: true
  items:
    templated:
      source: parameterStore
      target:
        template:
          data: {DSN: "{{ .host }}:5432"}
      data:
        - secretKey: host
          remoteRef: {key: /ci/db-host}
    from-default:                   # no source: Secrets Manager store
      dataFrom:
        - extract: {key: ci/other}
pushSecrets:
  enabled: true
  items:
    to-secrets-manager:
      source: secretsManager
      selector: {secret: {name: generated}}
      data:
        - match: {secretKey: token, remoteRef: {remoteKey: ci/generated-token}}
