# Only Parameter Store: it is the default store; custom ServiceAccount name, no namePrefix.
aws:
  roleArn: "arn:aws:iam::123456789012:role/{{ .Release.Name }}-params"
  region: us-east-1
  serviceAccountName: "{{ .Release.Name }}-params"
parameterStore:
  enabled: true
  secrets:
    config:
      fromPath: /config
externalSecrets:
  enabled: true
  items:
    fallback:
      dataFrom:
        - extract: {key: /config/json-blob}
