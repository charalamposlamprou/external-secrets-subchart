# Source: external-secrets-subchart/templates/pushsecret.yaml
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ci-to-secrets-manager
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.3.0
spec:
  refreshInterval: "1h"
  secretStoreRefs:
    - name: ci-aws-secrets-manager
      kind: SecretStore
  selector:
    secret:
      name: generated
  data:
    - match:
        remoteRef:
          remoteKey: ci/generated-token
        secretKey: token
