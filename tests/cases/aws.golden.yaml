# Source: external-secrets-subchart/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-app-flags
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.1
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: ci-parameter-store
    kind: SecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ci-app-flags
  dataFrom:
    - find:
        name:
          regexp: .*
        path: /ci/flags
      rewrite:
      - regexp:
          source: ^/ci/flags/
          target: ""
      - regexp:
          source: /
          target: _
---
# Source: external-secrets-subchart/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-db-credentials
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.1
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: ci-secrets-manager
    kind: SecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ci-db-credentials
    template:
      data:
        DATABASE_URL: postgres://{{ .DB_USER }}:{{ .DB_PASS }}@db:5432/app
      mergePolicy: Merge
  data:
    - remoteRef:
        key: ci/api-token
      secretKey: API_TOKEN
    - remoteRef:
        key: ci/db
        property: password
        version: AWSCURRENT
      secretKey: DB_PASS
    - remoteRef:
        key: ci/db
        property: username
      secretKey: DB_USER
