# Source: external-secrets-subchart/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-secrets
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.1
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ci-secrets
    owner: platform
automountServiceAccountToken: false
---
# Source: external-secrets-subchart/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-app-config
  namespace: default
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/instance: ci
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: external-secrets-subchart
    app.kubernetes.io/part-of: ci
    helm.sh/chart: external-secrets-subchart-0.5.1
spec:
  refreshInterval: "10m"
  secretStoreRef:
    name: ci-parameter-store
    kind: SecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: ci-app-config
  data:
    - remoteRef:
        key: /ci/api-url
      secretKey: API_URL
    - remoteRef:
        key: /ci/log-level
      secretKey: LOG_LEVEL
---
