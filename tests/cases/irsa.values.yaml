# One IAM role per app: a dedicated IRSA ServiceAccount per store.
namePrefix: "{{ .Release.Name }}-"
serviceAccounts:
  app-secrets:
    roleArn: arn:aws:iam::123456789012:role/app-secrets
  shared-secrets:
    namespace: platform
    roleArn: "arn:aws:iam::123456789012:role/{{ .Release.Name }}-shared"
secretStores:
  aws:
    provider:
      aws:
        service: SecretsManager
        region: eu-west-1
        auth:
          jwt:
            serviceAccountRef: {name: app-secrets}
clusterSecretStores:
  aws-shared:
    provider:
      aws:
        service: SecretsManager
        region: eu-west-1
        auth:
          jwt:
            serviceAccountRef: {name: shared-secrets}
  controller-role:            # no auth: uses the ESO controller's own role
    provider:
      aws: {service: ParameterStore, region: eu-west-1}
defaults:
  secretStoreRef: {name: aws}
externalSecrets:
  app-env:
    dataFrom:
      - extract: {key: app/env}
