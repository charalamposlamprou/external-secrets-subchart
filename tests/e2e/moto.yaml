# Mock AWS (STS, SSM Parameter Store, Secrets Manager) for tests/e2e.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moto
  namespace: aws-mock
spec:
  selector:
    matchLabels: {app: moto}
  template:
    metadata:
      labels: {app: moto}
    spec:
      enableServiceLinks: false   # else the "moto" Service injects MOTO_PORT=tcp://..., which moto reads as its port
      containers:
        - name: moto
          image: motoserver/moto:5.2.4
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /moto-api/, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: moto
  namespace: aws-mock
spec:
  selector: {app: moto}
  ports: [{port: 5000, targetPort: 5000}]
