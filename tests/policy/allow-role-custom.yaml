apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: role-custom, namespace: attacker}
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      role: arn:aws:iam::123456789012:role/attacker-secrets
      sessionTagsPolicy: Custom
      customSessionTags: {team: payments}   # ESO's CRD itself rejects reserved keys such as esoNamespace here
