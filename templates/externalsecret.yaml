{{- if .Values.enabled }}
{{- range $name, $es := include "eso-sub.featureItems" (dict "root" $ "feature" "externalSecrets") | fromYaml }}
{{- if include "eso-sub.enabled" (dict "item" $es "desc" (printf "ExternalSecret %q" $name)) }}
{{- if not (or $es.data $es.dataFrom) }}
{{- fail (printf "external-secrets-subchart: ExternalSecret %q must set data and/or dataFrom" $name) }}
{{- end }}
{{- $fullName := include "eso-sub.name" (dict "root" $ "name" $name) }}
{{- $target := merge (deepCopy ($es.target | default dict)) (deepCopy ($.Values.defaults.target | default dict)) }}
{{- $_ := set $target "name" (tpl ($target.name | default $fullName) $) }}
---
apiVersion: {{ $.Values.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $fullName }}
  namespace: {{ $es.namespace | default $.Release.Namespace }}
  labels:
    {{- include "eso-sub.labels" (dict "root" $ "extra" $es.labels) | nindent 4 }}
  {{- with include "eso-sub.annotations" (dict "root" $ "extra" $es.annotations) }}{{ . | nindent 2 }}{{- end }}
spec:
  refreshInterval: {{ include "eso-sub.refreshInterval" (dict "root" $ "item" $es) }}
  {{- with $es.refreshPolicy }}
  refreshPolicy: {{ . }}
  {{- end }}
  secretStoreRef:
    {{- include "eso-sub.storeRef" (dict "root" $ "ref" $es.secretStoreRef "source" $es.source "item" (printf "ExternalSecret %q" $name)) | nindent 4 }}
  target:
    {{- toYaml $target | nindent 4 }}
  {{- with $es.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $es.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
