{{- if .Values.enabled }}
{{- $namespaced := include "eso-sub.secretStoreItems" $ | fromYaml }}
{{- $cluster := include "eso-sub.featureItems" (dict "root" $ "feature" "clusterSecretStores") | fromYaml }}
{{- range $kind, $stores := dict "SecretStore" $namespaced "ClusterSecretStore" $cluster }}
{{- range $name, $s := $stores }}
{{- if include "eso-sub.enabled" (dict "item" $s "desc" (printf "%s %q" $kind $name)) }}
{{- if not $s.provider }}
{{- fail (printf "external-secrets-subchart: %s %q must set provider" $kind $name) }}
{{- end }}
{{- if hasKey ($s.extraSpec | default dict) "provider" }}
{{- fail (printf "external-secrets-subchart: %s %q: set provider at the top level, not in extraSpec" $kind $name) }}
{{- end }}
{{- $provider := deepCopy $s.provider }}
{{- include "eso-sub.awsAuth" (dict "root" $ "provider" $provider "kind" $kind "store" $s "desc" (printf "%s %q" $kind $name)) }}
---
apiVersion: {{ $.Values.apiVersion }}
kind: {{ $kind }}
metadata:
  name: {{ include "eso-sub.name" (dict "root" $ "name" $name) }}
  {{- if eq $kind "SecretStore" }}
  namespace: {{ $s.namespace | default $.Release.Namespace }}
  {{- end }}
  labels:
    {{- include "eso-sub.labels" (dict "root" $ "extra" $s.labels) | nindent 4 }}
  {{- with include "eso-sub.annotations" (dict "root" $ "extra" $s.annotations) }}{{ . | nindent 2 }}{{- end }}
spec:
  provider:
    {{- tpl (toYaml $provider) $ | nindent 4 }}
  {{- with $s.extraSpec }}
  {{- tpl (toYaml .) $ | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
