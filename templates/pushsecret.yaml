{{- if .Values.enabled }}
{{- range $name, $ps := .Values.pushSecrets }}
{{- if include "eso-sub.enabled" $ps }}
{{- if not (and $ps.selector $ps.data) }}
{{- fail (printf "external-secrets-subchart: PushSecret %q must set selector and data" $name) }}
{{- end }}
---
apiVersion: {{ $.Values.pushSecretApiVersion }}
kind: PushSecret
metadata:
  name: {{ include "eso-sub.name" (dict "root" $ "name" $name) }}
  namespace: {{ $ps.namespace | default $.Release.Namespace }}
  labels:
    {{- include "eso-sub.labels" (dict "root" $ "extra" $ps.labels) | nindent 4 }}
  {{- with include "eso-sub.annotations" (dict "root" $ "extra" $ps.annotations) }}{{ . | nindent 2 }}{{- end }}
spec:
  refreshInterval: {{ $ps.refreshInterval | default $.Values.defaults.refreshInterval | quote }}
  {{- with $ps.updatePolicy }}
  updatePolicy: {{ . }}
  {{- end }}
  {{- with $ps.deletionPolicy }}
  deletionPolicy: {{ . }}
  {{- end }}
  secretStoreRefs:
    {{- if $ps.secretStoreRefs }}
    {{- range $ps.secretStoreRefs }}
    - {{ include "eso-sub.storeRef" (dict "root" $ "ref" . "item" (printf "PushSecret %q" $name)) | indent 6 | trim }}
    {{- end }}
    {{- else }}
    - {{ include "eso-sub.storeRef" (dict "root" $ "ref" dict "item" (printf "PushSecret %q" $name)) | indent 6 | trim }}
    {{- end }}
  selector:
    {{- toYaml $ps.selector | nindent 4 }}
  data:
    {{- toYaml $ps.data | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
