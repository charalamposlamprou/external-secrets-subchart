{{- if .Values.enabled }}
{{- range $name, $ces := .Values.clusterExternalSecrets }}
{{- if include "eso-sub.enabled" (dict "item" $ces "desc" (printf "ClusterExternalSecret %q" $name)) }}
{{- if not $ces.externalSecretSpec }}
{{- fail (printf "external-secrets-subchart: ClusterExternalSecret %q must set externalSecretSpec" $name) }}
{{- end }}
{{- $fullName := include "eso-sub.name" (dict "root" $ "name" $name) }}
{{- $spec := deepCopy $ces.externalSecretSpec }}
{{- $ref := include "eso-sub.storeRef" (dict "root" $ "ref" $spec.secretStoreRef "item" (printf "ClusterExternalSecret %q" $name)) | fromYaml }}
{{- $_ := set $spec "secretStoreRef" $ref }}
---
apiVersion: {{ $.Values.apiVersion }}
kind: ClusterExternalSecret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "eso-sub.labels" (dict "root" $ "extra" $ces.labels) | nindent 4 }}
  {{- with include "eso-sub.annotations" (dict "root" $ "extra" $ces.annotations) }}{{ . | nindent 2 }}{{- end }}
spec:
  externalSecretName: {{ $ces.externalSecretName | default $fullName }}
  {{- with $ces.namespaceSelectors }}
  namespaceSelectors:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $ces.namespaces }}
  namespaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $ces.refreshTime }}
  refreshTime: {{ . }}
  {{- end }}
  externalSecretSpec:
    {{- toYaml $spec | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
