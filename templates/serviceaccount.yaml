{{- if .Values.enabled }}
{{- range $name, $sa := .Values.serviceAccounts }}
{{- if include "eso-sub.enabled" (dict "item" $sa "desc" (printf "ServiceAccount %q" $name)) }}
{{- $annotations := deepCopy ($sa.annotations | default dict) }}
{{- with $sa.roleArn }}
{{- $_ := set $annotations "eks.amazonaws.com/role-arn" (tpl . $) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eso-sub.name" (dict "root" $ "name" $name) }}
  namespace: {{ $sa.namespace | default $.Release.Namespace }}
  labels:
    {{- include "eso-sub.labels" (dict "root" $ "extra" $sa.labels) | nindent 4 }}
  {{- with include "eso-sub.annotations" (dict "root" $ "extra" $annotations) }}{{ . | nindent 2 }}{{- end }}
{{- /* ESO requests tokens through the TokenRequest API; nothing needs a mounted token. */}}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
