apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  annotations:
    # Optional: with Stakater Reloader installed, pods restart when these Secrets change.
    secret.reloader.stakater.com/reload: "my-app-config,my-app-flags,my-app-env,my-app-db"
spec:
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      containers:
        - name: app
          image: {{ .Values.image }}
          envFrom:
            # Secrets created by the ExternalSecrets in the subchart
            - secretRef:
                name: my-app-env
            - secretRef:
                name: my-app-config
            - secretRef:
                name: my-app-flags
            - secretRef:
                name: my-app-db
