apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      containers:
        - name: app
          image: {{ .Values.image }}
          envFrom:
            # Secrets created by the ExternalSecrets in the subchart
            - secretRef:
                name: my-app-env
            - secretRef:
                name: my-app-config
