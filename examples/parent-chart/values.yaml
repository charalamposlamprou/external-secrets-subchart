image: nginx:1.27

# Everything about this app's secrets, in one block (the subchart's alias).
secrets:
  # The app's IAM role (create it with examples/terraform/irsa-role).
  aws:
    roleArn: arn:aws:iam::123456789012:role/my-cluster-my-app-secrets
    region: eu-west-1

  # SSM Parameter Store: each entry is one Kubernetes Secret.
  parameterStore:
    enabled: true
    secrets:
      my-app-config:
        LOG_LEVEL: /my-app/log-level
        API_URL: /my-app/api-url
      my-app-flags:
        fromPath: /my-app/flags/      # every parameter under the path

  # AWS Secrets Manager: each entry is one Kubernetes Secret.
  secretsManager:
    enabled: true
    secrets:
      my-app-env:
        fromSecret: my-app/env        # every JSON field of the secret
      my-app-db:
        DB_USER: {key: my-app/db, property: username}
        DB_PASS: {key: my-app/db, property: password}
