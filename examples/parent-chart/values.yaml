image: nginx:1.27

# Everything about this app's secrets lives in this one block (the subchart's alias).
# Each feature is off until enabled.
secrets:
  enabled: true

  # One IAM role for this app (create it with examples/terraform/irsa-role).
  # Renders ServiceAccount "<release>-secrets" with the role, plus one SecretStore per service.
  aws:
    enabled: true
    roleArn: arn:aws:iam::123456789012:role/my-app-secrets
    region: eu-west-1
    secretsManager:
      enabled: true
    parameterStore:
      enabled: true

  externalSecrets:
    enabled: true
    items:
      my-app-env:                       # Secret "my-app-env" <- every key of secret my-app/env
        source: secretsManager
        dataFrom:
          - extract:
              key: my-app/env
      my-app-config:                    # Secret "my-app-config" <- parameters
        source: parameterStore
        data:
          - secretKey: LOG_LEVEL
            remoteRef:
              key: /my-app/log-level
        dataFrom:
          - find:
              path: /my-app/config/     # needs allow_find = true in the Terraform

  pushSecrets:
    enabled: false
    items: {}
