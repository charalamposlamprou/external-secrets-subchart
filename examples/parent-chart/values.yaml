image: nginx:1.27

# Everything under the alias key is passed to the subchart.
secrets:
  enabled: true
  defaults:
    secretStoreRef:
      name: vault-backend
      kind: SecretStore
  secretStores:
    vault-backend:
      provider:
        vault:
          server: https://vault.example.com
          path: secret
          version: v2
          auth:
            kubernetes:
              mountPath: kubernetes
              role: my-app
  externalSecrets:
    my-app-env:
      dataFrom:
        - extract:
            key: my-app/env
