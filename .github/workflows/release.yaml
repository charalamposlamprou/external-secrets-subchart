name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Check tag matches Chart.yaml version
        run: |
          chart_version="$(helm show chart . | awk '/^version:/ {print $2}')"
          if [ "v${chart_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Chart.yaml version ${chart_version}"
            exit 1
          fi

      - run: helm lint . --strict
      - run: helm lint . --strict -f ci/full-values.yaml
      # lint only reports template `fail` calls as INFO; the tests render and catch them
      - run: tests/run.sh

      - name: Package and push to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package . --destination dist
          helm push dist/*.tgz "oci://ghcr.io/${OWNER,,}/charts"
