name: lint
on: [push, pull_request]

permissions:
  contents: read

jobs:
  helm:
    name: helm (${{ matrix.helm }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.16.2, v3.22.1, v4.3.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - run: helm lint . --strict
      - run: helm lint . --strict -f ci/full-values.yaml
      - run: tests/run.sh
      - run: tests/check-docs.sh
      - name: Parent chart example
        working-directory: examples/parent-chart
        run: helm dependency update && helm template my-app .

  crds:
    name: crds (ESO ${{ matrix.eso }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # oldest supported, oldest for aws.auth: podIdentity (sessionTagsPolicy), latest
        eso: [v0.17.0, v2.5.0, v2.14.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: eso-crds
      - run: tests/validate-crds.sh "${{ matrix.eso }}"
      - name: Admission policy for Pod Identity
        if: matrix.eso != 'v0.17.0'   # session tags need ESO >= 2.5.0
        run: tests/validate-policy.sh

  e2e:
    name: e2e (ESO 2.14.0 + mock AWS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: eso-e2e
      - run: tests/e2e.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n my-app describe secretstore,externalsecret
          kubectl -n external-secrets logs deploy/external-secrets --tail=100

  terraform:
    name: terraform (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [irsa-role, eso-pod-identity]
    defaults:
      run:
        working-directory: examples/terraform/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # base branch history and tags
      - run: ci/check-version-bump.sh "origin/${GITHUB_BASE_REF}"
