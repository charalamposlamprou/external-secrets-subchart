name: lint
on: [push, pull_request]
jobs:
  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: helm lint . --strict
      - run: helm lint . --strict -f ci/full-values.yaml
      - run: tests/run.sh
      - name: Parent chart example
        working-directory: examples/parent-chart
        run: helm dependency update && helm template my-app .
